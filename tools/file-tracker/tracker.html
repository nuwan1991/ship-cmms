<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Tracker</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f2f5; --text: #1b1f24; --muted: #5d6673;
    --border: #dde1e6; --accent: #0b5cad; --accent-text: #ffffff; --wa: #1fa855; --wa-text: #ffffff;
    --mark: #fff1a8;
    --s-received: #1d7a3a; --s-po: #0b5cad; --s-dispatched: #2a7f7f; --s-funding: #8a5a00; --s-tender: #6b3fa0;
    --s-file: #345; --s-pr: #6c737d; --s-none: #9aa1aa; --s-rejected: #b42318;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --surface: #1b1e23; --surface-2: #23272d; --text: #e7e9ec; --muted: #9aa3ad;
      --border: #30353c; --accent: #5aa2ec; --accent-text: #0d1117; --wa: #25c264; --wa-text: #07140c;
      --mark: #5c4d00;
      --s-received: #4cc472; --s-po: #5aa2ec; --s-dispatched: #4fc1c1; --s-funding: #e0a935; --s-tender: #b48ce6;
      --s-file: #a9b8c8; --s-pr: #9aa1aa; --s-none: #737a83; --s-rejected: #f0705f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417; --surface: #1b1e23; --surface-2: #23272d; --text: #e7e9ec; --muted: #9aa3ad;
    --border: #30353c; --accent: #5aa2ec; --accent-text: #0d1117; --wa: #25c264; --wa-text: #07140c;
    --mark: #5c4d00;
    --s-received: #4cc472; --s-po: #5aa2ec; --s-dispatched: #4fc1c1; --s-funding: #e0a935; --s-tender: #b48ce6;
    --s-file: #a9b8c8; --s-pr: #9aa1aa; --s-none: #737a83; --s-rejected: #f0705f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 0 6px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .source { color: var(--muted); font-size: 12.5px; padding-bottom: 6px; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.wa { background: var(--wa); border-color: var(--wa); color: var(--wa-text); font-weight: 600; }
  .btn.small { padding: 4px 10px; font-size: 13.5px; }

  .search { display: flex; gap: 8px; padding-bottom: 8px; }
  .search input { flex: 1 1 auto; min-width: 0; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); max-width: 100%; }
  .filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-bottom: 10px; }
  .filters select { width: 100%; }
  @media (max-width: 640px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .summary { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; padding: 10px 0; gap: 8px; flex-wrap: wrap; }
  .list { display: grid; gap: 10px; padding-bottom: 110px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card-head { display: flex; gap: 10px; align-items: flex-start; }
  .card-head input[type=checkbox] { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  .title { font-weight: 650; font-size: 15.5px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .title .more { font-weight: 400; color: var(--muted); font-size: 13.5px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .pill { flex: none; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .fields { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 10px 0 0; font-size: 14px; }
  .fields dt { color: var(--muted); }
  .fields dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .fields dd.txt { font-family: inherit; font-size: 14px; }
  .note { margin-top: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13.5px; overflow-wrap: anywhere; }
  .note b { color: var(--muted); font-weight: 600; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
  .items { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
  .items th, .items td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .items th { color: var(--muted); font-weight: 600; }
  .items td.n { text-align: right; white-space: nowrap; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 10px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 6; display: none; }
  .bar.show { display: block; }
  .bar .wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar .count { flex: 1 1 auto; font-weight: 600; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 16px; display: grid; gap: 10px; }
  .dlg h2 { font-size: 17px; margin: 0; }
  .dlg label { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
  .dlg input[type=text], .dlg input[type=tel], .dlg textarea, .dlg select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  .dlg textarea { min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; resize: vertical; }
  .dlg .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .dlg .check { display: flex; gap: 8px; align-items: center; color: var(--text); }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .contact { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  @media (max-width: 520px) { .contact { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>File Tracker</h1>
      <button class="btn small" id="btnContacts" type="button">Departments</button>
      <label class="btn small primary" for="fileInput">Load Excel</label>
      <input id="fileInput" type="file" accept=".xlsx" hidden>
    </div>
    <div class="source" id="source"></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search item, file no, order no, supplier…" autocomplete="off">
      <select id="field" aria-label="Search in">
        <option value="all">All fields</option>
        <option value="item">Item name</option>
        <option value="file">File No</option>
        <option value="order">Order No</option>
        <option value="supplier">Supplier</option>
        <option value="refs">GORF / PR / RL No</option>
        <option value="position">Present position</option>
      </select>
    </div>
    <div class="filters">
      <select id="fSheet" aria-label="Sheet"></select>
      <select id="fStatus" aria-label="Status"></select>
      <select id="fOffice" aria-label="Office"></select>
      <select id="fSupplier" aria-label="Supplier"></select>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="summary">
    <span id="count"></span>
    <span><button class="btn small" id="btnSelectAll" type="button">Select shown</button> <button class="btn small" id="btnReset" type="button">Clear filters</button></span>
  </div>
  <div class="list" id="list"></div>
</main>

<div class="bar" id="bar">
  <div class="wrap">
    <span class="count" id="selCount"></span>
    <button class="btn small" id="btnClearSel" type="button">Clear</button>
    <button class="btn wa" id="btnShareSel" type="button">Share on WhatsApp</button>
  </div>
</div>

<dialog id="shareDlg">
  <form method="dialog" class="dlg" id="shareForm">
    <h2>Share on WhatsApp</h2>
    <label>Send to
      <select id="shareTo"></select>
    </label>
    <label id="phoneWrap">WhatsApp number (with country code, e.g. 94771234567)
      <input type="tel" id="sharePhone" inputmode="tel" placeholder="Leave empty to pick the chat in WhatsApp">
    </label>
    <label class="check"><input type="checkbox" id="shareItems" checked> Include item list</label>
    <label>Message (you can edit before sending)
      <textarea id="shareText"></textarea>
    </label>
    <div class="row">
      <button class="btn" value="cancel" type="submit">Close</button>
      <button class="btn" id="btnCopy" type="button">Copy</button>
      <button class="btn" id="btnNativeShare" type="button" hidden>Share…</button>
      <button class="btn wa" id="btnOpenWa" type="button">Open WhatsApp</button>
    </div>
  </form>
</dialog>

<dialog id="contactsDlg">
  <form method="dialog" class="dlg">
    <h2>Departments</h2>
    <p class="hint">Save the WhatsApp numbers of the departments you follow up with. Put the office code from the file number (for example <code>ENA/APO</code> or <code>NHQ/SSOLPCA</code>) to have that department picked automatically when you share a file held there. Saved on this device only.</p>
    <div id="contactRows" style="display:grid;gap:8px"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="btnAddContact" type="button">+ Add department</button>
      <span><button class="btn" value="cancel" type="submit">Close</button> <button class="btn primary" id="btnSaveContacts" type="button">Save</button></span>
    </div>
    <p class="hint" id="officeList"></p>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script src="parser.js"></script>
<script>
const EMBEDDED = /*__DATA__*/null;

(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('fileTracker.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('fileTracker.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem('fileTracker.' + k); } catch (e) {} },
  };

  const STATUS_ORDER = ['Not started', 'PR / GORF', 'File open', 'Tender / TEC', 'Funding', 'PO created', 'Dispatched', 'Received', 'Rejected'];
  const STATUS_COLOR = {
    'Received': '--s-received', 'PO created': '--s-po', 'Dispatched': '--s-dispatched', 'Funding': '--s-funding',
    'Tender / TEC': '--s-tender', 'File open': '--s-file', 'PR / GORF': '--s-pr', 'Not started': '--s-none', 'Rejected': '--s-rejected',
  };

  let data = null;          // { source, generated, records }
  let shown = [];
  const selected = new Set();
  let shareRecs = [];

  // ---------- data ----------
  function setData(d, persist) {
    data = d;
    selected.clear();
    if (persist) store.set('data', d);
    $('source').textContent = d
      ? `${d.records.length} files · from ${d.source}${d.generated ? ' · updated ' + d.generated : ''}`
      : 'No data yet. Tap "Load Excel" and choose the File Update .xlsx.';
    buildFilters();
    render();
  }

  async function loadFile(file) {
    try {
      const records = await FileTrackerParser.parseWorkbook(await file.arrayBuffer());
      const d = { source: file.name, generated: new Date().toLocaleDateString('en-GB'), loadedAt: Date.now(), records };
      setData(d, true);
      toast(`Loaded ${records.length} files from ${file.name}`);
    } catch (e) {
      alert('Could not read this file: ' + e.message);
    }
  }

  // ---------- filters ----------
  function fill(sel, label, values) {
    const cur = sel.value;
    sel.innerHTML = '';
    sel.append(new Option(label, ''));
    for (const v of values) sel.append(new Option(v, v));
    sel.value = values.includes(cur) ? cur : '';
  }
  function uniq(arr) { return [...new Set(arr.filter(Boolean))]; }
  function suppliersOf(r) { return r.supplier ? r.supplier.split(' / ') : []; }

  function buildFilters() {
    const recs = data ? data.records : [];
    fill($('fSheet'), 'All sheets', uniq(recs.map((r) => r.sheet)));
    fill($('fStatus'), 'All statuses', STATUS_ORDER.filter((s) => recs.some((r) => r.status === s)));
    fill($('fOffice'), 'All offices', uniq(recs.map((r) => r.office)).sort());
    fill($('fSupplier'), 'All suppliers', uniq(recs.flatMap(suppliersOf)).sort((a, b) => a.localeCompare(b)));
  }

  function haystack(r, field) {
    const items = r.items.map((i) => [i.item, i.name2, i.code].join(' ')).join(' ');
    switch (field) {
      case 'item': return items;
      case 'file': return r.file;
      case 'order': return r.order + ' ' + r.position;
      case 'supplier': return r.supplier + ' ' + r.position + ' ' + r.remarks;
      case 'refs': return [r.gorf, r.pr, r.rl].join(' ');
      case 'position': return r.position + ' ' + r.remarks;
      default: return [items, r.file, r.gorf, r.pr, r.rl, r.order, r.supplier, r.position, r.remarks, r.section, r.sheet, r.system, r.office].join(' ');
    }
  }
  const norm = (s) => String(s || '').toLowerCase().replace(/\s+/g, ' ');

  function filtered() {
    if (!data) return [];
    const q = norm($('q').value).trim();
    const terms = q ? q.split(' ') : [];
    const field = $('field').value;
    const fs = $('fSheet').value, st = $('fStatus').value, of = $('fOffice').value, su = $('fSupplier').value;
    return data.records.filter((r) => {
      if (fs && r.sheet !== fs) return false;
      if (st && r.status !== st) return false;
      if (of && r.office !== of) return false;
      if (su && !suppliersOf(r).includes(su)) return false;
      if (!terms.length) return true;
      const h = norm(haystack(r, field));
      return terms.every((t) => h.includes(t));
    });
  }

  // ---------- render ----------
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function hl(s) {
    const text = esc(s);
    const q = $('q').value.trim();
    if (!q) return text;
    const terms = q.split(/\s+/).filter((t) => t.length > 1).map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!terms.length) return text;
    return text.replace(new RegExp('(' + terms.join('|') + ')', 'gi'), '<mark>$1</mark>');
  }
  const money = (n) => n == null ? '' : 'Rs. ' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const qtyText = (i) => [i.qty, i.deno].filter((x) => x != null && x !== '').join(' ');

  function card(r) {
    const first = r.items[0] ? r.items[0].item : '(no item name)';
    const more = r.items.length > 1 ? ` <span class="more">+ ${r.items.length - 1} more item${r.items.length > 2 ? 's' : ''}</span>` : '';
    const color = `var(${STATUS_COLOR[r.status] || '--s-none'})`;
    const rows = [
      ['File No', r.file], ['Order No', r.order], ['Supplier', r.supplier, true], ['GORF', r.gorf], ['PR No', r.pr], ['RL No', r.rl],
      ['Office', r.office], ['Value', money(r.value), true],
    ].filter((x) => x[1]);
    const meta = [r.sheet, r.section, r.sn ? 'S/N ' + r.sn : ''].filter(Boolean).join(' › ');
    const items = r.items.length > 1 || (r.items[0] && (r.items[0].qty != null || r.items[0].name2)) ? `
      <details><summary>Items (${r.items.length})</summary>
        <table class="items"><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Total</th></tr></thead><tbody>
        ${r.items.map((i) => `<tr><td>${hl(i.item)}${i.name2 ? `<br><small>${hl(i.name2)}</small>` : ''}</td><td class="n">${esc(qtyText(i))}</td><td class="n">${esc(i.total != null ? Number(i.total).toLocaleString('en-US') : '')}</td></tr>`).join('')}
        </tbody></table></details>` : '';
    return `<article class="card${selected.has(r.id) ? ' sel' : ''}" data-id="${r.id}">
      <div class="card-head">
        <input type="checkbox" class="pick" aria-label="Select" ${selected.has(r.id) ? 'checked' : ''}>
        <div class="title">${hl(first)}${more}<div class="meta">${esc(meta)}</div></div>
        <span class="pill" style="color:${color}">${esc(r.status)}</span>
      </div>
      ${rows.length ? `<dl class="fields">${rows.map(([k, v, txt]) => `<dt>${k}</dt><dd${txt ? ' class="txt"' : ''}>${hl(v)}</dd>`).join('')}</dl>` : ''}
      ${r.position ? `<div class="note"><b>Present position:</b> ${hl(r.position)}</div>` : ''}
      ${r.remarks ? `<div class="note"><b>Remarks:</b> ${hl(r.remarks)}</div>` : ''}
      ${items}
      <div class="actions">
        <button class="btn wa small act-share" type="button">WhatsApp</button>
        <button class="btn small act-copy" type="button">Copy details</button>
      </div>
    </article>`;
  }

  function render() {
    shown = filtered();
    const total = data ? data.records.length : 0;
    $('count').textContent = data ? `Showing ${shown.length} of ${total} files` : '';
    $('list').innerHTML = !data
      ? `<div class="empty">Load the monthly <b>File Update</b> Excel to start.<br><br><label class="btn primary" for="fileInput">Load Excel</label></div>`
      : shown.length ? shown.map(card).join('') : '<div class="empty">No files match. Try fewer words or clear the filters.</div>';
    updateBar();
  }

  function updateBar() {
    $('bar').classList.toggle('show', selected.size > 0);
    $('selCount').textContent = `${selected.size} selected`;
  }

  // ---------- message ----------
  function messageFor(r, withItems) {
    const L = [];
    const first = r.items[0] ? r.items[0].item : '';
    L.push(`*Item:* ${first}${r.items.length > 1 ? ` (+${r.items.length - 1} more)` : ''}`);
    const add = (k, v) => { if (v) L.push(`*${k}:* ${v}`); };
    add('File No', r.file); add('GORF', r.gorf); add('PR No', r.pr); add('RL No', r.rl);
    add('Order No', r.order); add('Supplier', r.supplier); add('Value', money(r.value));
    add('Present position', r.position); add('Remarks', r.remarks);
    if (withItems && r.items.length > 1) {
      L.push(`_Items (${r.items.length}):_`);
      r.items.forEach((i, n) => L.push(`${n + 1}. ${i.item}${qtyText(i) ? ' – ' + qtyText(i) : ''}`));
    }
    L.push(`_Ref: ${[r.sheet, r.section, r.sn ? 'S/N ' + r.sn : ''].filter(Boolean).join(' › ')}_`);
    return L.join('\n');
  }
  function buildMessage(recs, withItems) {
    const intro = recs.length > 1
      ? `Please update the current status of the following ${recs.length} files.`
      : 'Please update the current status of the following file.';
    return intro + '\n\n' + recs.map((r) => messageFor(r, withItems)).join('\n\n— — —\n\n');
  }

  // ---------- contacts ----------
  const contacts = () => store.get('contacts', []);
  function phoneDigits(p) { return String(p || '').replace(/[^\d]/g, ''); }

  function openShare(recs) {
    shareRecs = recs;
    const list = contacts();
    const sel = $('shareTo');
    sel.innerHTML = '';
    sel.append(new Option('Choose the chat in WhatsApp', ''));
    list.forEach((c, i) => sel.append(new Option(`${c.name}${c.phone ? ' – ' + c.phone : ''}`, String(i))));
    sel.append(new Option('Type a number…', 'custom'));
    const offices = uniq(recs.map((r) => r.office));
    const match = offices.length === 1 ? list.findIndex((c) => (c.offices || '').split(/[,\s]+/).filter(Boolean).some((o) => offices[0].toUpperCase().startsWith(o.toUpperCase()))) : -1;
    sel.value = match >= 0 ? String(match) : '';
    $('sharePhone').value = '';
    syncPhone();
    $('shareItems').checked = store.get('includeItems', true);
    $('shareText').value = buildMessage(recs, $('shareItems').checked);
    $('btnNativeShare').hidden = !navigator.share;
    $('shareDlg').showModal();
  }
  function syncPhone() { $('phoneWrap').hidden = $('shareTo').value !== 'custom'; }
  function targetPhone() {
    const v = $('shareTo').value;
    if (v === 'custom') return phoneDigits($('sharePhone').value);
    if (v === '') return '';
    return phoneDigits((contacts()[Number(v)] || {}).phone);
  }

  function renderContacts() {
    const rows = $('contactRows');
    const list = contacts();
    if (!list.length) list.push({ name: '', phone: '', offices: '' });
    rows.innerHTML = list.map((c, i) => `<div class="contact" data-i="${i}">
      <input type="text" class="c-name" placeholder="Department (e.g. APO(E))" value="${esc(c.name)}">
      <input type="tel" class="c-phone" placeholder="94771234567" value="${esc(c.phone)}">
      <input type="text" class="c-off" placeholder="Office code(s)" value="${esc(c.offices)}">
      <button class="btn small c-del" type="button" aria-label="Remove">✕</button>
    </div>`).join('');
    const offices = data ? uniq(data.records.map((r) => r.office)).sort() : [];
    $('officeList').textContent = offices.length ? 'Office codes in this file: ' + offices.join(', ') : '';
  }
  function readContacts() {
    return [...$('contactRows').querySelectorAll('.contact')].map((row) => ({
      name: row.querySelector('.c-name').value.trim(),
      phone: row.querySelector('.c-phone').value.trim(),
      offices: row.querySelector('.c-off').value.trim(),
    })).filter((c) => c.name || c.phone);
  }

  // ---------- helpers ----------
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied'); } catch (e2) { alert(text); }
      ta.remove();
    }
  }
  const byId = (id) => data.records.find((r) => r.id === id);

  // ---------- events ----------
  let t;
  $('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 120); });
  ['field', 'fSheet', 'fStatus', 'fOffice', 'fSupplier'].forEach((id) => $(id).addEventListener('change', render));
  $('btnReset').addEventListener('click', () => {
    $('q').value = ''; $('field').value = 'all';
    ['fSheet', 'fStatus', 'fOffice', 'fSupplier'].forEach((id) => ($(id).value = ''));
    render();
  });
  $('btnSelectAll').addEventListener('click', () => { shown.forEach((r) => selected.add(r.id)); render(); });
  $('btnClearSel').addEventListener('click', () => { selected.clear(); render(); });
  $('btnShareSel').addEventListener('click', () => openShare(data.records.filter((r) => selected.has(r.id))));
  $('fileInput').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });

  $('list').addEventListener('click', (e) => {
    const el = e.target.closest('.card');
    if (!el) return;
    const r = byId(Number(el.dataset.id));
    if (e.target.classList.contains('pick')) {
      if (e.target.checked) selected.add(r.id); else selected.delete(r.id);
      el.classList.toggle('sel', e.target.checked);
      updateBar();
    } else if (e.target.classList.contains('act-share')) openShare([r]);
    else if (e.target.classList.contains('act-copy')) copy(messageFor(r, true));
  });

  $('shareTo').addEventListener('change', syncPhone);
  $('shareItems').addEventListener('change', () => {
    store.set('includeItems', $('shareItems').checked);
    $('shareText').value = buildMessage(shareRecs, $('shareItems').checked);
  });
  $('btnCopy').addEventListener('click', () => copy($('shareText').value));
  $('btnNativeShare').addEventListener('click', () => navigator.share({ text: $('shareText').value }).catch(() => {}));
  $('btnOpenWa').addEventListener('click', () => {
    const phone = targetPhone();
    const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent($('shareText').value);
    window.open(url, '_blank', 'noopener');
  });

  $('btnContacts').addEventListener('click', () => { renderContacts(); $('contactsDlg').showModal(); });
  $('btnAddContact').addEventListener('click', () => {
    const list = readContacts(); list.push({ name: '', phone: '', offices: '' });
    store.set('contacts', list); renderContacts();
  });
  $('contactRows').addEventListener('click', (e) => {
    if (!e.target.classList.contains('c-del')) return;
    e.target.closest('.contact').remove();
  });
  $('btnSaveContacts').addEventListener('click', () => {
    if (store.set('contacts', readContacts())) toast('Departments saved');
    else toast('Could not save on this device');
    $('contactsDlg').close();
  });

  // Latest Excel loaded on this device wins over the data built into the page,
  // unless the built-in data is newer (a fresh page was shared).
  const saved = store.get('data', null);
  const pick = saved && (!EMBEDDED || saved.loadedAt > (EMBEDDED.builtAt || 0)) ? saved : EMBEDDED;
  setData(pick, false);
})();
</script>
</body>
</html>
